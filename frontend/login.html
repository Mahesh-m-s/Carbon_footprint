<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Carbon Footprint EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      padding: 20px;
    }
    .login-wrapper {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-brand .brand-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 12px;
      color: var(--green);
    }
    .login-brand h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--text);
    }
    .login-brand h2 .accent {
      color: var(--green);
    }
    .login-brand p {
      color: var(--text2);
      font-size: 0.9rem;
      margin-top: 5px;
    }
    .login-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .login-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      color: var(--text2);
      font-weight: 500;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }
    .login-tab:hover {
      color: var(--text);
    }
    .login-tab.active {
      color: var(--green);
      font-weight: 700;
      border-bottom: 2px solid var(--green);
    }
    .login-form {
      display: none;
    }
    .login-form.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .btn-login {
      width: 100%;
      justify-content: center;
      padding: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="17" stroke="currentColor" stroke-width="1.5"/><path d="M18 8C14 12 10 14 10 19c0 4.4 3.6 8 8 8s8-3.6 8-8c0-5-4-7-8-11z" fill="currentColor" opacity="0.8"/><path d="M18 14c-2 3-4 4-4 6.5A4 4 0 0018 24.5 4 4 0 0022 20.5c0-2.5-2-3.5-4-6.5z" fill="white" opacity="0.6"/></svg>
      </div>
      <h2>Carbon<span class="accent">EMS</span></h2>
      <p>Sign in to continue</p>
    </div>

    <div class="login-tabs">
      <div class="login-tab active" onclick="switchTab('user')">User (USN)</div>
      <div class="login-tab" onclick="switchTab('admin')">Admin</div>
    </div>

    <form id="userForm" class="login-form active" onsubmit="handleLogin(event, 'user')">
      <div class="form-group">
        <label>USN (Student ID)</label>
        <input type="text" id="usnInput" placeholder="e.g. 1RV20CS001" required />
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="dobInput" required />
      </div>
      <button type="submit" class="btn-primary btn-login">Login as User</button>
    </form>

    <form id="adminForm" class="login-form" onsubmit="handleLogin(event, 'admin')">
      <div class="form-group">
        <label>Admin ID</label>
        <input type="text" id="adminIdInput" placeholder="Enter Admin ID" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPwdInput" placeholder="Enter Password" required />
      </div>
      <button type="submit" class="btn-primary btn-login">Login as Admin</button>
    </form>

    <div id="loginMsg" class="form-msg" style="margin-top: 20px;"></div>
  </div>

  <script>
    function switchTab(type) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
      
      if (type === 'user') {
        document.querySelectorAll('.login-tab')[0].classList.add('active');
        document.getElementById('userForm').classList.add('active');
      } else {
        document.querySelectorAll('.login-tab')[1].classList.add('active');
        document.getElementById('adminForm').classList.add('active');
      }
      
      document.getElementById('loginMsg').style.display = 'none';
    }

    async function handleLogin(e, type) {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      
      const payload = { type };
      if (type === 'user') {
        payload.username = document.getElementById('usnInput').value.trim();
        payload.dob = document.getElementById('dobInput').value;
      } else {
        payload.username = document.getElementById('adminIdInput').value.trim();
        payload.password = document.getElementById('adminPwdInput').value;
      }
      
      msg.style.display = 'none';

      try {
        const btn = e.target.querySelector('button');
        const oldText = btn.innerText;
        btn.innerText = 'Authenticating...';
        btn.disabled = true;

        const res = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        btn.innerText = oldText;
        btn.disabled = false;

        if (data.success) {
          msg.className = 'form-msg success';
          msg.innerText = 'Login successful! Redirecting...';
          msg.style.display = 'block';
          
          localStorage.setItem('carbonEmsRole', data.role);
          localStorage.setItem('carbonEmsUser', data.username);
          
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        } else {
          msg.className = 'form-msg error';
          msg.innerText = data.error || 'Login failed';
          msg.style.display = 'block';
        }
      } catch (err) {
        msg.className = 'form-msg error';
        msg.innerText = 'Network error. Make sure server is running.';
        msg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
